# Deploys site/ to heartwood.forgesworn.dev — the shared Hetzner "routing" box,
# same rsync pattern as cambium's deploy-site. The Caddy vhost
# (site/deploy/heartwood.Caddyfile) is installed on the box separately and is
# excluded from the rsync; this workflow only replaces web content.
#
# Requires the HETZNER_SSH_KEY repository secret (the deploy@62.238.98.53
# private key, as used by cambium's deploy-site workflow).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys for 62.238.98.53 (captured with ssh-keyscan on
          # 2026-08-19) — replaces the per-run ssh-keyscan TOFU, under which a
          # MITM during the scan could redirect the rsync. If the box is
          # reinstalled, re-scan deliberately and update these lines.
          cat > ~/.ssh/known_hosts <<'EOF'
          62.238.98.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINr4gdIzT/1x6isUAmLfoap8d6TPF/3OJjVsjtyhnxx9
          62.238.98.53 ssh-rsa 
          62.238.98.53 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNlArhQaGuK2A5GeEZ4NT01oTFMc0Dl8S4Um1lJRWmepniOQDEaBrQduoxofjOc5o6bW7w+8KB92A4OAYQU/C1k=
          EOF
          rsync -avz --delete \
            --exclude "deploy/" \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/ deploy@62.238.98.53:/opt/heartwood/
