# Deploys site/ to heartwood.forgesworn.dev — the shared Hetzner "routing" box,
# same rsync pattern as cambium's deploy-site. The Caddy vhost
# (site/deploy/heartwood.Caddyfile) is installed on the box separately and is
# excluded from the rsync; this workflow only replaces web content.
#
# Requires the HETZNER_SSH_KEY repository secret (the deploy@95.217.39.110
# private key, as used by cambium's deploy-site workflow).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys for 95.217.39.110 (captured with ssh-keyscan on
          # 2026-08-19) — replaces the per-run ssh-keyscan TOFU, under which a
          # MITM during the scan could redirect the rsync. If the box is
          # reinstalled, re-scan deliberately and update these lines.
          cat > ~/.ssh/known_hosts <<'EOF'
          95.217.39.110 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIvyQS88Q/dHmMqiHA5nlSZ36QoLg8iMJxGAFRxcCatkweNgbz/agQ71UTdf/UQlSu0EebJkyVRAHMrwL/lPB8Y=
          95.217.39.110 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILClsLCThi06mGvX7qW0RPSzt4UoZsEgdc79drRvMc6n
          95.217.39.110 ssh-rsa 
          EOF
          rsync -avz --delete \
            --exclude "deploy/" \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/ deploy@95.217.39.110:/opt/heartwood/
