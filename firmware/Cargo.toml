[package]
name = "heartwood-esp32"
version = "0.18.0-beta.12"
edition = "2021"
description = "nsec-tree signing device firmware for Heltec WiFi LoRa 32 (V3 and V4)"
license = "MIT"

[features]
# Default build targets the Heltec V4 (native USB-Serial-JTAG on GPIO19/20).
# The release log ceiling is repeated here (heltec-v4 carries it too) so an ad
# hoc build of the default board keeps it even if the board feature changes.
default = ["heltec-v4", "log/release_max_level_off"]
# Heltec WiFi LoRa 32 V4 -- USB-C wired to ESP32-S3 native USB pins.
heltec-v4 = ["dep:qrcodegen-no-heap", "log/release_max_level_off", "sha-accel"]
# Heltec WiFi LoRa 32 V3 -- USB-C wired through a CP2102 bridge to UART0
# (GPIO43 TX / GPIO44 RX). Mutually exclusive with heltec-v4.
heltec-v3 = ["log/release_max_level_off", "sha-accel"]
# Colour ST7789 TFT display backend (T-Display, ESP32-C6). Colour-panel boards
# enable this; it pulls in the mipidsi driver. Mono-OLED boards (Heltec) leave
# it off and keep the ssd1306 backend. `st7789-check` compiles the backend
# module on a mono board for CI/type-checking without swapping the display.
st7789 = ["dep:mipidsi"]
st7789-check = ["st7789"]
# LilyGO / TENSTAR T-Display: classic ESP32-D0WD + ST7789 240x135 colour TFT.
# Built for the xtensa-esp32-espidf target (see scripts/build-firmware.sh).
tdisplay = ["st7789", "dep:qrcodegen-no-heap", "log/release_max_level_warn"]
# Waveshare ESP32-C6-Touch-LCD-1.47: ESP32-C6 (RISC-V rv32imac) + JD9853 172×320
# portrait IPS panel. Built for the riscv32imac-esp-espidf target.
# Note: the display controller is JD9853 (NOT ST7789); the jd9853 module sends
# the vendor init sequence directly over raw SPI without mipidsi.
c6 = ["dep:qrcodegen-no-heap", "log/release_max_level_warn", "sha-accel"]
# Run the sealed-seed KDF on the chip's SHA accelerator. Enabled by every board
# whose SHA peripheral can be resumed from a saved digest state (SOC_SHA_SUPPORT_RESUME:
# the ESP32-S3 Heltecs and the ESP32-C6), which is what PBKDF2 needs to carry the
# HMAC pad midstates. The classic ESP32 (T-Display) has the parallel-engine SHA
# with no resume, so it leaves this off and keeps the pure-Rust path. See
# firmware/src/sha_accel.rs and docs/2026-09-18-pbkdf2-cost-and-sha-acceleration.md.
sha-accel = []
# BENCH ONLY. Corrupts one bit of every hardware compression so the boot-time
# known-answer self-check fails, which is how HARDWARE-TEST-CHECKLIST section 25
# exercises the mismatch path (log, fall back to software, never derive a key
# with the failed engine). Never enable this in an image anyone will use.
sha-selfcheck-fail = ["sha-accel"]

# Branded board-check demo (deliberately NOT the signer): title screen, button
# check, and a two-button jump-and-duck game. Ships pre-flashed on boards sold
# untouched-by-vendor-firmware; proves display + both buttons + USB work while
# making it obvious the real signer still has to be flashed. Opt-in so normal
# firmware builds never compile or ship it.
demo-game = []

[dependencies]
heartwood-common = { path = "../common", default-features = false, features = ["nip46", "nip44", "nip04", "secp256k1-backend", "mnemonic-gen", "ota-sign", "device-identity", "seed-encrypt", "cash"] }

# Crypto — libsecp256k1 C FFI (alignment-safe on Xtensa, unlike k256)
# BIP-340 verification otherwise links libsecp256k1's ~1.1 MB default
# precomputation tables. Embedded signers prefer the upstream low-memory table
# geometry: identical verification semantics, slightly slower operations, and
# enough flash headroom for the Heltec A/B OTA slots.
secp256k1 = { version = "0.29", features = ["lowmemory"] }
sha2 = "0.10"
zeroize = { version = "1", default-features = false, features = ["derive", "alloc"] }

# Serial protocol
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Relay management: avatar bytes travel base64-encoded inside NIP-44 requests.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# ESP-IDF std framework
esp-idf-svc = { version = "0.52", features = ["binstart"] }
esp-idf-hal = "0.46"

# OLED display
ssd1306 = "0.9"
embedded-graphics = "0.8"
# Heap-free QR encoder for the physical bearer-note handover screen. The
# bounded v2/v8 output buffers live on the stack and are scrubbed after use.
qrcodegen-no-heap = { version = "1.8.1", optional = true }

# ST7789 colour TFT driver -- only compiled in for the `st7789` feature
# (colour-panel boards). Mono-OLED Heltec builds never pull it in.
mipidsi = { version = "0.10", optional = true }

# Logging. The release ceiling is set per board, because the log crate allows
# only one: the colour-panel boards (tdisplay, c6) keep warnings and errors,
# compiling out the verbose operational trace that is otherwise duplicated by
# the on-device UI. Both Heltec boards build with CONFIG_ESP_CONSOLE_NONE (and
# SECONDARY_NONE on the V4), so a release log line there has nowhere to go:
# they compile every level out, which is what keeps their fixed 2 MiB OTA slot
# within budget (about 89 KB on the V3 image). Debug builds keep all logging;
# a dev build that brings a console back should build debug, or drop the
# heltec `release_max_level_off` below for the session.
log = "0.4"

[[bin]]
name = "heartwood-demo"
path = "src/bin/demo.rs"
required-features = ["tdisplay", "demo-game"]

[build-dependencies]
embuild = "0.33"

# Size-optimise the release binary. The WiFi-standalone + on-device-generation
# firmware must fit the 2 MB ota_0 slot; default release (opt-level=3) overflowed
# it. opt-level="z" + a single codegen unit claws it back. (LTO is NOT used —
# it breaks the secp256k1-sys C build under the xtensa -mlongcalls toolchain.)
[profile.release]
opt-level = "z"
codegen-units = 1
